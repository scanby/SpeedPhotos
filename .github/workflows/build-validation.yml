name: Validate SpeedPhotos build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild .\SpeedPhotos.sln /t:Rebuild /p:Configuration=Release /m /v:minimal
